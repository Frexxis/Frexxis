<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="Frexxis terminal profile card">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1117"/>
      <stop offset="0.55" stop-color="#111821"/>
      <stop offset="1" stop-color="#070b10"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151d28"/>
      <stop offset="1" stop-color="#0d131b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ecf8e"/>
      <stop offset="0.5" stop-color="#00c2ff"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="statueGlow" cx="48%" cy="34%" r="58%">
      <stop offset="0" stop-color="#f1f5f9" stop-opacity="0.92"/>
      <stop offset="0.28" stop-color="#9ca3af" stop-opacity="0.72"/>
      <stop offset="0.7" stop-color="#334155" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="cardClip">
      <rect x="28" y="28" width="1144" height="564" rx="28"/>
    </clipPath>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
      .title { fill: #e5edf6; font-size: 18px; font-weight: 700; letter-spacing: .02em; }
      .cmd { fill: #3ecf8e; font-size: 17px; font-weight: 700; }
      .text { fill: #d7dee8; font-size: 18px; }
      .muted { fill: #8b98a8; font-size: 15px; }
      .line { stroke: #334155; stroke-width: 1; }
      .thin { stroke: #64748b; stroke-width: 1.2; fill: none; }
      .hair { fill: #0b0f16; stroke: #334155; stroke-width: 2; }
      .face { fill: #cbd5e1; }
      .shade { fill: #64748b; opacity: .88; }
      .deep { fill: #101721; opacity: .96; }
      .rim { fill: none; stroke: url(#accent); stroke-width: 3; opacity: .86; }
    </style>
  </defs>

  <rect width="1200" height="620" fill="url(#bg)"/>
  <g clip-path="url(#cardClip)">
    <rect x="28" y="28" width="1144" height="564" rx="28" fill="url(#panel)" filter="url(#shadow)"/>
    <circle cx="1040" cy="78" r="190" fill="#00c2ff" opacity="0.07"/>
    <circle cx="955" cy="510" r="230" fill="#8b5cf6" opacity="0.07"/>
    <path d="M36 74H1164" stroke="url(#accent)" stroke-width="2" opacity="0.7"/>
  </g>

  <g transform="translate(58 52)">
    <circle cx="14" cy="14" r="6" fill="#ff5f57"/>
    <circle cx="34" cy="14" r="6" fill="#ffbd2e"/>
    <circle cx="54" cy="14" r="6" fill="#28c840"/>
    <text x="86" y="20" class="mono title">frexxis@github ~ [session: active]</text>
  </g>

  <g transform="translate(58 106)">
    <rect width="632" height="388" rx="18" fill="#0a1017" stroke="#263241"/>
    <path d="M0 54H632" class="line"/>
    <text x="28" y="36" class="mono muted">terminal://falorin/profile</text>

    <text x="28" y="92" class="mono cmd">$ whoami</text>
    <rect x="28" y="112" width="560" height="88" rx="12" fill="#111a24" stroke="#2b3949"/>
    <text x="50" y="145" class="mono text">Muhammet Ali Adıyaman</text>
    <text x="50" y="173" class="mono muted">Co-Founder @ Falorin, Inc. · Turkey</text>

    <text x="28" y="238" class="mono cmd">$ cat stack.conf</text>
    <text x="50" y="274" class="mono text">[lang]      Python · TypeScript · Rust · Dart</text>
    <text x="50" y="302" class="mono text">[frontend]  Next.js · Remix · React · Tailwind</text>
    <text x="50" y="330" class="mono text">[infra]     Supabase · PostgreSQL · Docker · Vercel</text>
    <text x="50" y="358" class="mono text">[ai]        agents · search · SaaS platforms</text>

    <text x="28" y="414" class="mono cmd">$ cat mission.txt</text>
    <text x="50" y="450" class="mono text">Democratize AI. Let everyone create digital products.</text>
    <text x="50" y="478" class="mono muted">MVP → test → measure → iterate</text>
  </g>

  <g transform="translate(742 80)" filter="url(#softGlow)">
    <ellipse cx="202" cy="252" rx="180" ry="218" fill="url(#statueGlow)" opacity="0.56"/>
    <path class="rim" d="M50 474c33-67 83-99 151-99 70 0 121 32 154 99"/>

    <path class="deep" d="M117 126c21-43 59-67 111-70 48-3 88 14 119 51 27 34 38 79 33 136-18-48-44-80-78-96-42-20-87-17-134 9-25 14-42 37-51 70-9-42-9-75 0-100z"/>
    <g opacity="0.96">
      <circle cx="147" cy="106" r="25" class="hair"/>
      <circle cx="181" cy="84" r="31" class="hair"/>
      <circle cx="225" cy="80" r="34" class="hair"/>
      <circle cx="268" cy="96" r="31" class="hair"/>
      <circle cx="303" cy="126" r="27" class="hair"/>
      <circle cx="119" cy="153" r="24" class="hair"/>
      <circle cx="333" cy="166" r="25" class="hair"/>
    </g>

    <path class="face" d="M156 128c48-24 105-15 139 22 31 34 39 86 22 146-14 52-43 91-85 107-36 14-74 7-104-20-32-29-48-72-45-123 3-62 27-106 73-132z"/>
    <path class="shade" d="M244 130c39 11 65 38 76 82 12 50 3 99-27 148-18 29-40 47-67 55 41-8 71-44 91-107 19-60 12-112-22-156-13-16-30-24-51-22z"/>
    <path class="deep" d="M102 241c24-35 61-54 112-58 48-4 86 9 114 39-8-36-29-63-62-80-37-20-78-18-123 6-28 15-42 46-41 93z" opacity="0.42"/>

    <path d="M142 258c27-17 58-19 93-6" stroke="#eef4fb" stroke-width="5" stroke-linecap="round" opacity="0.58"/>
    <path d="M231 253c27-8 50-4 71 12" stroke="#eef4fb" stroke-width="5" stroke-linecap="round" opacity="0.44"/>
    <path d="M224 206c10 42 6 80-13 115" stroke="#526174" stroke-width="7" stroke-linecap="round" opacity="0.82"/>
    <path d="M173 345c32 18 70 18 114 0" stroke="#253140" stroke-width="8" stroke-linecap="round" opacity="0.72"/>
    <path d="M158 376c39 33 88 41 145 13" stroke="#e5edf6" stroke-width="3" stroke-linecap="round" opacity="0.35"/>

    <path class="face" d="M154 402c28 21 69 23 108 4l21 75H128l26-79z"/>
    <path class="shade" d="M236 413l47 68h-76c19-14 29-37 29-68z"/>
    <path class="deep" d="M48 488c31-65 83-99 157-101 77-2 132 32 164 101v46H48v-46z"/>
    <path d="M94 505c60 32 136 34 221 3" stroke="#94a3b8" stroke-width="4" opacity="0.35"/>
    <path d="M138 490l51 44 45-48" stroke="url(#accent)" stroke-width="4" opacity="0.72" fill="none"/>
  </g>

  <g transform="translate(768 503)">
    <rect x="0" y="0" width="368" height="56" rx="18" fill="#0a1017" stroke="#263241"/>
    <text x="24" y="35" class="mono muted">building:</text>
    <text x="112" y="35" class="mono title">Lookila · Nexite · Renov</text>
  </g>
</svg>
